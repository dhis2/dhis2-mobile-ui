name: Continuous deployment

# Publishes SNAPSHOT versions only. Releases are published by release-finish.yml.
on:
  push:
    branches:
      - develop # <version in build.gradle.kts>-SNAPSHOT
      - release/* # <X.Y.Z from the branch name>-SNAPSHOT

jobs:
  publish-maven:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set Up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Publish snapshot to maven
        run: |
          if [[ "$GITHUB_REF_NAME" == release/* ]]; then
            ./.github/workflows/scripts/publish-maven.sh snapshot "${GITHUB_REF_NAME#release/}-SNAPSHOT"
          else
            ./.github/workflows/scripts/publish-maven.sh snapshot
          fi
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_PORTAL_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PORTAL_PASSWORD }}
          SIGNING_PRIVATE_KEY: ${{ secrets.PGP_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.PGP_PASSPHRASE }}
