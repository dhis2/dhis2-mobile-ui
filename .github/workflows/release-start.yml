name: Release start

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      release_version_name:
        description: 'New release version name'
        required: true
        type: string

      development_version_name:
        description: 'Development version name'
        required: true
        type: string

# Every write below goes through DHIS2_BOT_GITHUB_TOKEN, so the default GITHUB_TOKEN needs nothing.
permissions:
  contents: read

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Cuts release/<release_version_name> off develop as-is. No version bump is needed here: the
  # release version always matches the version already on develop.
  create_branch:

    runs-on: ubuntu-latest

    env:
      RELEASE_BRANCH: 'release/${{ inputs.release_version_name }}'

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.DHIS2_BOT_GITHUB_TOKEN }}

      - name: Create and push release branch
        run: |
          git checkout -b ${{ env.RELEASE_BRANCH }}
          git push origin ${{ env.RELEASE_BRANCH }}

  # Bumps develop to the next development version through a PR.
  update_version:

    runs-on: ubuntu-latest

    env:
      DEVELOPMENT_BRANCH: 'update_version_to${{ inputs.development_version_name }}'

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.DHIS2_BOT_GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12.1

        # Pushed before committing: the GH API used below can only commit to an existing branch.
      - name: Create and push development branch
        run: |
          git checkout -b ${{ env.DEVELOPMENT_BRANCH }}
          git push origin ${{ env.DEVELOPMENT_BRANCH }}

      - name: Run Python script to update base branch version
        run: python .github/workflows/scripts/updateVersionName.py ${{ inputs.development_version_name }}

        # Uses the GH API so the commit is signed by GitHub and shows as Verified.
      - name: Commit and Push Changes
        uses: flex-development/gh-commit@177be4b5bca1b102400ca7220932d9ff7980fddb # 1.0.0
        with:
          message: 'Update version to ${{ inputs.development_version_name }}'
          token: ${{ secrets.DHIS2_BOT_GITHUB_TOKEN }}
          ref: ${{ env.DEVELOPMENT_BRANCH }}

        # Must use the bot PAT, not GITHUB_TOKEN: PRs opened with GITHUB_TOKEN do not trigger
        # workflows, so the required ci_job check would never run on this PR.
      - name: create pull request
        run: gh pr create -B develop -H ${{ env.DEVELOPMENT_BRANCH }} --title 'Merge ${{ env.DEVELOPMENT_BRANCH }} into develop' --body 'Created by Github action'
        env:
          GH_TOKEN: ${{ secrets.DHIS2_BOT_GITHUB_TOKEN }}
